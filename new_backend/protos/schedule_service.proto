syntax = "proto3";

package schedule;

option go_package = "/bb";

service ScheduleService {
     rpc CreateSlot (CreateSlotRequest) returns (SlotResponse);
     rpc GetSlot (SlotIdRequest) returns (SlotResponse);
     rpc UpdateSlot (UpdateSlotRequest) returns (SlotResponse);
     rpc DeleteSlot (SlotIdRequest) returns (Empty);
     rpc ListBusySlotsForUser (UserIdRequest) returns (SlotListResponse);
     rpc ListAvailableSlotsForUser (UserIdRequest) returns (SlotListResponse);
     rpc SaveSchedulePatternForUser (SaveSchedulePatternRequest) returns (SchedulePatternResponse);
     rpc GetSchedulePatternsForUser (UserIdRequest) returns (SchedulePatternResponse);
}

message Slot {
     int64 id = 1;
     int64 user_id = 2; 
     string time = 3;
     bool is_available = 4;
}

message CreateSlotRequest {
     int64 user_id = 1;
     string time = 2;
}

message UserIdRequest {
     int64 user_id = 1;
}

message UpdateSlotRequest {
     int64 id = 1;
     bool is_available = 2;
}

message SlotIdRequest {
     int64 id = 1;
}

message SlotResponse {
     Slot slot = 1;
}

message SlotListResponse {
     repeated Slot slots = 1;
}

message Empty {}

message SlotPattern {
    string weekday = 1;
    string time = 2;
}

message SchedulePattern {
    int64 user_id = 1;
    string schedule_type = 2;
    repeated SlotPattern time_slots = 3;
    int32 days_ahead = 4;
}

message SaveSchedulePatternRequest {
    SchedulePattern pattern = 1;
}

message SchedulePatternResponse {
    SchedulePattern pattern = 1;
}
