services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  migrate:
    build:
      context: ./migrate
      dockerfile: Dockerfile
    environment:
      DB_URL: postgres://postgres:postgres@db:5432/mydb?sslmode=disable
    command: >
      sh -c "
        goose -dir ./migrations postgres postgres://postgres:postgres@db:5432/mydb?sslmode=disable up
      "
    depends_on:
      db:
        condition: service_healthy

  user_app:
    build: ./user
    container_name: user_service
    ports:
      - "8080:8080"
    environment:
      DB_URL: postgres://postgres:postgres@db:5432/mydb?sslmode=disable
      PORT: 8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  schedule_app:
    build: ./schedule
    container_name: schedule_service
    ports:
      - "8081:8080"
    environment:
      DB_URL: postgres://postgres:postgres@db:5432/mydb?sslmode=disable
      PORT: 8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
